{% extends "base.html" %}
{% block title %}Editar pago{% endblock %}
{% block content %}

<h2 class="mb-4">Editar pago</h2>

<form method="POST" class="row g-3">
  {% csrf_token %}
  <div class="col-md-3">
    <label class="form-label">Fecha</label>
    <input type="text" name="fecha" class="form-control flatpickr-date" value="{{ pago[0] }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Tipo</label>
    <select name="tipo" class="form-select" required>
      <option value="almuerzo" {% if pago[1] == 'almuerzo' %}selected{% endif %}>Almuerzo</option>
      <option value="cena" {% if pago[1] == 'cena' %}selected{% endif %}>Cena</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">Cantidad</label>
    <input type="number" name="cantidad" class="form-control" value="{{ pago[3] }}" min="1" required>
  </div>
  <div class="col-md-3">
    <label class="form-label">Monto</label>
    <input type="number" name="monto" class="form-control" value="{{ pago[2] }}" step="0.01" min="0" required>
  </div>
  <div class="col-md-8">
    <label class="form-label">Ciclo de pago asociado</label>
    <select name="ciclo_id" class="form-select">
      <option value="" {% if not pago[4] %}selected{% endif %}>-- Pendiente (sin ciclo) --</option>
      {% for id, etiqueta in ciclos %}
        <option value="{{ id }}" {% if pago[4] == id %}selected{% endif %}>{{ etiqueta }}</option>
      {% endfor %}
    </select>
    <div class="form-text">
      Si el ciclo correcto no tiene la fecha de inicio esperada, puedes
      <a href="/pagos" class="link-secondary">corregirla desde la lista de ciclos</a>.
    </div>
  </div>
  <div class="col-12 text-end">
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a href="/pagos" class="btn btn-secondary">Cancelar</a>
  </div>
</form>

{% endblock %}
